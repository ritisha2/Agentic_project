version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: esp_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5.14.0
    container_name: esp_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - neo4j_data:/data

  postgres:
    image: postgres:15
    container_name: esp_postgres
    environment:
      - POSTGRES_DB=esp_agent
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: esp_redis
    ports:
      - "6379:6379"

volumes:
  qdrant_data:
  neo4j_data:
  postgres_data:
