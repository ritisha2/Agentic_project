[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "esp_agent"
version = "1.0.0"
description = "Knowledge-Base-Agnostic ESP Diagnostic Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.0.0",
    "pypdf>=4.0.0",
    "qdrant-client>=1.7.0",
    "neo4j>=5.14.0",
    "pandas>=2.0.0",
    "polars>=0.20.0",
    "sentence-transformers>=2.2.2",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "typer>=0.9.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.0.0",
    "mcp>=1.2.0",
    "json-repair>=0.30.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
