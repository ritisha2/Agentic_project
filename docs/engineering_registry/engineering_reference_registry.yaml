pvt_correlations_not_standards:
  note: >
    These are peer-reviewed literature correlations, not standards. Priority tier 6/7 per the
    source-priority policy. Selection is a client/engineering decision and must be explicitly
    configured per field/reservoir, not defaulted by the service.
  candidates_requiring_client_selection:
    - "Standing correlation (solution GOR / Bo)"
    - "Vasquez-Beggs correlation"
    - "Beggs-Brill multiphase flow correlation"
    - "Turpin-type gas-handling correlation"
  status: "NONE PRE-SELECTED - REQUIRES ENGINEERING VALIDATION / CLIENT SPECIFICATION before use"
