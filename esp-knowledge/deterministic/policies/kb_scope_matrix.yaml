# ESP-PMM KB Scope Matrix
# Defines what belongs in the Knowledge Base vs Runtime Tools/APIs
# Version: 1.0.0

kb_scope_matrix:
  static_kb_knowledge:
    - concept: "ESP Operating Concepts"
      description: "Basic principles, artificial lift theory, pump behavior"
      storage: "Vector KB (pgvector) + Document Store"
    - concept: "ESP Component Anatomy"
      description: "Motor, protector, intake, gas separator, pump, cable, gauges"
      storage: "Structured YAML + Vector KB"
    - concept: "OEM Equipment Manuals"
      description: "Manufacturer operational guidelines, limits, assembly diagrams"
      storage: "MinIO/S3 + Document Chunks"
    - concept: "Pump Performance Curves"
      description: "H-Q curves, BEP points, ROR boundaries for pump models"
      storage: "Structured Postgres (pump_curves) + Vector KB"
    - concept: "Physics & Calculation Specs"
      description: "TDH formula, ROR deviation logic, pressure gradient theory"
      storage: "Structured YAML + Vector KB"
    - concept: "Fault Taxonomy & Patterns"
      description: "Hydraulic, mechanical, electrical, thermal, well fault modes"
      storage: "Structured YAML (faults/) + Postgres (fault_patterns)"
    - concept: "Alert & Action Playbooks"
      description: "Allowed next steps, forbidden actions, escalation roles"
      storage: "Structured YAML (alerts/)"
    - concept: "Model Output Semantics"
      description: "Field definitions and confidence meanings for Model Team predictions"
      storage: "Structured YAML (model_semantics/)"
    - concept: "Business & Engineering Glossary"
      description: "Definitions for ROR, BEP, TDH, PIP, PDP, WHP, GOR, BHT, PI"
      storage: "Structured YAML (glossary/) + Postgres (glossary_terms)"

  runtime_dynamic_facts:
    - concept: "Live Telemetry Readings"
      access_mechanism: "get_live_telemetry(asset_id)"
      authority: "Simulator API / EPR Telemetry API"
    - concept: "Historical Telemetry Data"
      access_mechanism: "get_historical_telemetry(asset_id, start, end)"
      authority: "Time-Series DB / History API"
    - concept: "Model Predictions (Anomaly/Fault/RUL)"
      access_mechanism: "get_model_output(asset_id)"
      authority: "Model Team API / Event Bus"
    - concept: "Active System Alerts"
      access_mechanism: "get_active_alerts(asset_id)"
      authority: "Alert / Monitoring Service"
    - concept: "Asset Configuration & Registration"
      access_mechanism: "get_asset(asset_id)"
      authority: "Advait / Client Platform Asset API"
    - concept: "Maintenance History & Intervention Logs"
      access_mechanism: "get_maintenance_history(asset_id)"
      authority: "Client Maintenance System API"
